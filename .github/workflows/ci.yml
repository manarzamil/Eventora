name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest

    # The test suite runs against a real PostgreSQL instance rather than a
    # substitute, because the behaviour under test — transactions, conditional
    # updates, unique indexes — is exactly what a fake would not reproduce.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eventora
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eventora_test
      AUTH_SECRET: ci-only-secret-value-that-is-long-enough-0123456789
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create the test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE eventora_test;'

      - name: Apply migrations
        run: npm run db:migrate

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
